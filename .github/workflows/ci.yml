name: CI - Docker Build & Smoke Test

# Runs on every push to any branch, and on pull requests
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run unit tests (plate validation + pricing)
        run: pytest -v api/tests

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests        # build only if the tests passed
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build

      - name: Start the stack and wait for healthchecks
        run: docker compose up -d --wait

      - name: Smoke test - camera POST, dashboard GET through Nginx
        run: |
          curl -fsS -X POST http://localhost:8080/api/cars \
               -H "Content-Type: application/json" \
               -d '{"plate":"1234567","gate":"CI"}'
          curl -fsS http://localhost:8080/api/cars | grep "12-345-67"
          curl -fsS http://localhost:8080/ | grep "Smart Parking"

      - name: Persistence test - down, up, data still there
        run: |
          docker compose down          # no -v -> the volume is kept
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/cars | grep "12-345-67"

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
