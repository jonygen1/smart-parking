server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard (static files)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: the browser calls /api/... on the SAME origin as the page,
    # Nginx forwards it to the "api" container inside the Docker network.
    # Same origin = no CORS problems, and the API port doesn't have to be public.
    # "api" is the service name from docker-compose.yml (Docker's internal DNS).
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
